.tb>*{padding:12px 16px;display:grid;gap:4px;text-decoration:none;color:inherit}
.tb>*+*{border-left:1.5px solid var(--ink)}
.tb span{color:var(--pencil)}
.tb b{font-size:13px}
.tb a:hover,.tb a:focus-visible{background:var(--mark);color:var(--on-mark)}
.tb a:hover span,.tb a:focus-visible span{color:var(--on-mark)}
:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
